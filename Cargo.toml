[workspace]
name = "cross_chain_atomic_swap"
version = "0.1.0"
edition = "2024"
resolver = "2"
members = ["schnorr_adaptor_signature"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vinay Sawant"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies across workspace
tokio = { version = "1.48", features = ["full"] }
thiserror = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Core library
schnorr_adaptor_signature = { path = "schnorr_adaptor_signature" }

# Blockchain-specific
ethers = "2.0.14"
solana-client = "3.1.3"
solana-sdk = "3.0.0"
spl-token = "9.0.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
